<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cybernetic Arcade · Digital core preview</title>
<meta name="theme-color" content="#010204">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="arcade.css">
<!-- Three.js is vendored locally (arcade/vendor). No CDN, no external requests. -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
</head>
<body>
<main id="arcade" class="arcade" aria-hidden="true">
  <div class="arcade__vignette"></div>
  <div class="arcade__fade"></div>

</main>
<!-- Direct-access holographic section stations positioned around the central core. -->
<nav class="world-stations" id="world-stations" aria-label="Explore portfolio sections">
  <button class="world-station world-station--about" data-section="about" type="button"><span class="world-station__number">01</span><span class="world-station__name">About Me</span><span class="world-station__hint">IDENTITY NODE</span></button>
  <button class="world-station world-station--journey" data-section="journey" type="button"><span class="world-station__number">02</span><span class="world-station__name">My Journey</span><span class="world-station__hint">TIMELINE NODE</span></button>
  <button class="world-station world-station--skills" data-section="skills" type="button"><span class="world-station__number">03</span><span class="world-station__name">Skills</span><span class="world-station__hint">CAPABILITY NODE</span></button>
  <button class="world-station world-station--projects" data-section="projects" type="button"><span class="world-station__number">04</span><span class="world-station__name">Projects</span><span class="world-station__hint">BUILD NODE</span></button>
  <button class="world-station world-station--certificates" data-section="certifications" type="button"><span class="world-station__number">05</span><span class="world-station__name">Certificates</span><span class="world-station__hint">CREDENTIAL NODE</span></button>
  <button class="world-station world-station--resume" data-section="resume" type="button"><span class="world-station__number">06</span><span class="world-station__name">Resume</span><span class="world-station__hint">PROFILE NODE</span></button>
  <button class="world-station world-station--contact" data-section="contact" type="button"><span class="world-station__number">07</span><span class="world-station__name">Contact</span><span class="world-station__hint">SIGNAL NODE</span></button>
</nav>
<!-- Identity area (phase 2): reserved, clean zone for the owner's name + a short introduction.
     Text is filled from ../content.json (name, role, first sentence of intro) by main.js. Nothing is hard-coded. -->
<section class="identity" id="identity" aria-labelledby="identity-name" hidden>
  <p class="identity__role" id="identity-role"></p>
  <h1 class="identity__name" id="identity-name"></h1>
  <p class="identity__intro" id="identity-intro"></p>
</section>
<!-- Navigation HUD (phase 4A): seven plain links to the portfolio sections. Sibling of #identity, outside the aria-hidden scene. -->
<nav class="hud" id="hud" aria-label="Portfolio sections">
  <button class="hud__toggle" id="hud-toggle" type="button" aria-expanded="false" aria-controls="hud-list">Sections</button>
  <ol class="hud__list" id="hud-list">
    <li><a href="../index.html#about" data-key="1"><span class="hud__n">01</span>About Me</a></li>
    <li><a href="../index.html#journey" data-key="2"><span class="hud__n">02</span>My Journey</a></li>
    <li><a href="../index.html#skills" data-key="3"><span class="hud__n">03</span>Skills</a></li>
    <li><a href="../index.html#projects" data-key="4"><span class="hud__n">04</span>Projects</a></li>
    <li><a href="../index.html#certifications" data-key="5"><span class="hud__n">05</span>Certificates</a></li>
    <li><a href="../index.html#resume" data-key="6"><span class="hud__n">06</span>Resume</a></li>
    <li><a href="../index.html#contact" data-key="7"><span class="hud__n">07</span>Contact</a></li>
  </ol>
</nav>
<!-- Projects station (phase 4B): screen-reader mirror of the in-scene panel. Filled by main.js from content.json. -->
<section class="sr-only" id="station-sr" aria-label="Projects" hidden>
  <h2>Projects</h2>
  <p aria-live="polite"></p>
  <ul></ul>
</section>
<!-- Portal traversal (phase 5C): shown while the camera is travelling to / resting in the Projects chamber. -->
<div class="dock" id="dock">
  <button class="dock__back" id="dock-back" type="button"><span class="dock__arrow" aria-hidden="true">&larr;</span>Back to core<kbd aria-hidden="true">Esc</kbd></button>
</div>
<p class="sr-only" id="dock-status" role="status" aria-live="polite"></p>
<!-- Portfolio section destinations (phase 6): shared lightweight section shell. Content is filled from content.json. -->
<p class="arcade__label" id="arcade-label">Cybernetic Arcade &middot; Digital core &middot; Phase 2<span> &mdash; press H to hide</span></p>
<noscript><p class="arcade__label arcade__label--static">This preview needs JavaScript and WebGL.</p></noscript>
<script type="module" src="main.js"></script>
</body>
</html>
